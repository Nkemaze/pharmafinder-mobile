</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>

<div class="flex flex-col">

</div>

</div>
<div class="h-[1px] w-full bg-outline-variant/30 ml-10"></div>
<button class="flex items-center justify-between py-4 w-full text-left active:bg-surface-variant transition-colors rounded-lg">

</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>

<div class="mt-12 flex justify-center pb-8">
<button class="h-touch-target px-6 bg-error-container text-on-error-container font-headline-md text-body-lg rounded-full flex items-center justify-center gap-2 active:bg-error/20 transition-colors">
<span class="material-symbols-outlined text-[20px]">logout</span>
            Sign Out
        </button>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('location-toggle');
            const knob = document.getElementById('location-knob');
            let isAllowed = true;

            toggle.addEventListener('click', () => {
                isAllowed = !isAllowed;
                if(isAllowed) {
                    toggle.classList.replace('bg-surface-variant', 'bg-primary');
                    knob.classList.replace('left-[2px]', 'right-[2px]');
                    knob.classList.replace('bg-outline', 'bg-on-primary');
                    toggle.previousElementSibling.querySelector('.text-primary').textContent = 'Allowed';
                    toggle.previousElementSibling.querySelector('.text-primary').classList.replace('text-on-surface-variant', 'text-primary');
                } else {
                    toggle.classList.replace('bg-primary', 'bg-surface-variant');
                    knob.classList.replace('right-[2px]', 'left-[2px]');
                    knob.classList.replace('bg-on-primary', 'bg-outline');
                    toggle.previousElementSibling.querySelector('.text-primary').textContent = 'Denied';
                    toggle.previousElementSibling.querySelector('.text-primary').classList.replace('text-primary', 'text-on-surface-variant');
                }
            });
        });
    </script>
