<script>
  function selectPharmacy(element) {
    document.querySelectorAll('.group.selected').forEach(el => {
      el.classList.remove('selected');
      const iconContainer = el.querySelector('div:first-child');
      const dot = el.querySelector('div:last-child');
      
      iconContainer.classList.remove('scale-110', 'bg-tertiary', 'text-on-tertiary');
      iconContainer.classList.add('bg-primary', 'text-on-primary');
      if(el.classList.contains('opacity-70')) {
        iconContainer.classList.add('bg-surface-variant', 'text-on-surface-variant');
        iconContainer.classList.remove('bg-primary', 'text-on-primary');
      }

      dot.classList.remove('bg-tertiary');
      dot.classList.add('bg-primary');
       if(el.classList.contains('opacity-70')) {
         dot.classList.add('bg-surface-variant');
         dot.classList.remove('bg-primary');
       }
    });

    element.classList.add('selected');
    const newIconContainer = element.querySelector('div:first-child');
    const newDot = element.querySelector('div:last-child');
    
    newIconContainer.classList.add('scale-110', 'bg-tertiary', 'text-on-tertiary');
    newIconContainer.classList.remove('bg-primary', 'text-on-primary', 'bg-surface-variant', 'text-on-surface-variant');
    
    newDot.classList.add('bg-tertiary');
    newDot.classList.remove('bg-primary', 'bg-surface-variant');

    const card = document.getElementById('pharmacy-card');
    card.classList.remove('translate-y-0', 'opacity-100');
    card.classList.add('translate-y-8', 'opacity-0');
    
    setTimeout(() => {
      card.classList.remove('translate-y-8', 'opacity-0');
      card.classList.add('translate-y-0', 'opacity-100');
    }, 150);
  }
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary"><div class="flex justify-around items-center h-16 px-2"><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-touch-target text-on-surface-variant transition-colors" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="text-label-md font-label-md">Home</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-touch-target text-on-surface-variant transition-colors" data-path="nearby" href="#"><span class="material-symbols-outlined">near_me</span><span class="text-label-md font-label-md">Nearby</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-touch-target transition-colors text-primary" data-path="map-view" href="#"><span class="material-symbols-outlined">map</span><span class="text-label-md font-label-md">Map</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-touch-target text-on-surface-variant transition-colors" data-path="settings" href="#"><span class="material-symbols-outlined">settings</span><span class="text-label-md font-label-md">Settings</span></a></div></nav></body></html>
